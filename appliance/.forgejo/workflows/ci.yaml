name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure production inputs
        run: cp .env.example .env
      - name: Go format
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.24.6-bookworm@sha256:ab1d1823abb55a9504d2e3e003b75b36dbeb1cbcc4c92593d85a84ee46becc6c sh -c 'test -z "$(gofmt -l .)"'
      - name: Go vet and tests
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.24.6-bookworm@sha256:ab1d1823abb55a9504d2e3e003b75b36dbeb1cbcc4c92593d85a84ee46becc6c sh -c 'go vet ./... && go test -race ./... && go test ./...'
      - name: Packaging and backup/restore contracts
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Compose validation
        run: docker compose config --quiet
      - name: Build router
        run: docker build -t web-retrieval-router:ci .
      - name: Smoke with deterministic fake upstream
        run: |
          docker network create web-retrieval-ci
          docker run -d --rm --name fake-cloud --network web-retrieval-ci python:3.13.5-alpine3.22@sha256:37b14db89f587f9eaa890e4a442a3fe55db452b69cca1403cc730bd0fbdc8aaf python -c 'from http.server import BaseHTTPRequestHandler,HTTPServer; H=type("H",(BaseHTTPRequestHandler,),{"do_POST":lambda s:(s.send_response(200),s.send_header("Content-Type","application/json"),s.end_headers(),s.wfile.write(b"{\"success\":true,\"data\":{\"web\":[{\"url\":\"https://example.invalid\"}]}}")),"log_message":lambda *a:None}); HTTPServer(("0.0.0.0",8000),H).serve_forever()'
          docker run -d --rm --name router-ci --network web-retrieval-ci -p 127.0.0.1:33000:8080 -e ROUTER_LOCAL_URL=http://fake-cloud:8000 -e ROUTER_CLOUD_URL=http://fake-cloud:8000 -e FIRECRAWL_CLOUD_API_KEY=fake-ci-key -e ROUTER_DAILY_CLOUD_CREDITS=20 -e ROUTER_MONTHLY_CLOUD_CREDITS=200 web-retrieval-router:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:33000/health && break; sleep 1; done
          ./scripts/smoke-test.sh
      - name: Cleanup
        if: always()
        run: docker rm -f router-ci fake-cloud 2>/dev/null || true; docker network rm web-retrieval-ci 2>/dev/null || true
