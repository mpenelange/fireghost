name: crw

on:
  push:
    branches: ["**"]
    paths:
      - crw/**
      - Makefile
      - .forgejo/workflows/crw.yaml
  pull_request:
    branches: [main]
    paths:
      - crw/**
      - Makefile
      - .forgejo/workflows/crw.yaml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Cache Cargo inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crw/target
          key: ${{ runner.os }}-crw-${{ hashFiles('crw/Cargo.lock') }}
      - name: Workspace gate
        run: make check-crw
      # The Camofox tier, the ladder wiring around it, and the impersonated
      # (wreq/BoringSSL) tier are feature-gated, so the default-feature gate
      # above never compiles them. The runtime image ships
      # `cdp,camofox,impersonated`; lint and test what ships. btls-sys builds
      # BoringSSL with CMake and generates bindings through libclang.
      - name: Install BoringSSL build dependencies
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO=sudo; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends cmake clang libclang-dev
      - name: Clippy (camofox + impersonated tiers)
        working-directory: crw
        run: cargo clippy -p crw-renderer -p crw-server --all-targets --features crw-renderer/cdp,crw-renderer/camofox,crw-renderer/impersonated,crw-server/camofox,crw-server/impersonated -- -D warnings
      - name: Test (camofox + impersonated tiers)
        working-directory: crw
        run: cargo test -p crw-renderer -p crw-server --features crw-renderer/cdp,crw-renderer/camofox,crw-renderer/impersonated,crw-server/camofox,crw-server/impersonated
      - name: Process and version guards
        working-directory: crw
        run: |
          bash scripts/check-no-process-exit.sh
          bash scripts/check-internal-dep-versions.sh
          python3 -m unittest scripts/test_live_compatibility.py
          python3 -m unittest scripts/test_scrape_compatibility.py
          python3 scripts/release/audit_release_please_config.py
          python3 scripts/release/test_guards.py
