name: router

on:
  push:
    branches: ["**"]
    paths:
      - router/**
      - Makefile
      - .forgejo/workflows/router.yaml
  pull_request:
    branches: [main]
    paths:
      - router/**
      - Makefile
      - .forgejo/workflows/router.yaml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Format, vet, unit, and race checks
        run: make check-router
