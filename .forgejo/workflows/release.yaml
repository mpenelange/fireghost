name: release

on:
  push:
    tags:
      - "fireghost-v*.*.*"

concurrency:
  group: appliance-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      candidate: ${{ steps.release.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - name: Cache Cargo inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crw/target
          key: ${{ runner.os }}-crw-${{ hashFiles('crw/Cargo.lock') }}

      - name: Resolve and validate release tags
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(python3 scripts/release_tags.py "$GITHUB_REF_NAME")"
          version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<<"$release_json")"
          minor="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["minor"])' <<<"$release_json")"
          candidate="candidate-$version-$GITHUB_RUN_ID-${GITHUB_RUN_ATTEMPT:-0}"
          printf 'version=%s\nminor=%s\ncandidate=%s\n' "$version" "$minor" "$candidate" >> "$GITHUB_OUTPUT"

      - name: Configure non-secret deployment inputs
        run: cp dev/.env.example dev/.env

      - name: Verify release source
        run: make check

  build-router:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clear prior Docker job data
        run: docker system prune -af --volumes
      - name: Log in to Forgejo registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login git.firewire.cc --username "$REGISTRY_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@v3
      - name: Build router candidate
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CANDIDATE: ${{ needs.verify.outputs.candidate }}
          IMAGE: git.firewire.cc/michael/fireghost-router
        run: |
          set -euo pipefail
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          docker buildx build --platform linux/amd64 --push \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg SOURCE="https://git.firewire.cc/michael/fireghost" \
            --label "io.firewire.appliance.version=$VERSION" \
            --tag "$IMAGE:$CANDIDATE" \
            router

  build-crw:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clear prior Docker job data
        run: docker system prune -af --volumes
      - name: Log in to Forgejo registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login git.firewire.cc --username "$REGISTRY_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@v3
      - name: Build CRW candidate
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CANDIDATE: ${{ needs.verify.outputs.candidate }}
          IMAGE: git.firewire.cc/michael/fireghost-crw
        run: |
          set -euo pipefail
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          crw_version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("crw/Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          docker buildx build --platform linux/amd64 --push \
            --build-arg CRW_VERSION="$crw_version" \
            --build-arg CRW_REVISION="$GITHUB_SHA" \
            --build-arg CRW_BUILD_DATE="$build_date" \
            --build-arg CRW_SOURCE="https://git.firewire.cc/michael/fireghost" \
            --label "io.firewire.appliance.version=$VERSION" \
            --tag "$IMAGE:$CANDIDATE" \
            crw

  validate:
    needs: [verify, build-router, build-crw]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clear build data before candidate extraction
        run: docker system prune -af --volumes
      - name: Configure non-secret deployment inputs
        run: cp dev/.env.example dev/.env
      - name: Log in to Forgejo registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login git.firewire.cc --username "$REGISTRY_USERNAME" --password-stdin
      - name: Validate candidate appliance
        env:
          ROUTER_IMAGE: git.firewire.cc/michael/fireghost-router:${{ needs.verify.outputs.candidate }}
          CRW_IMAGE: git.firewire.cc/michael/fireghost-crw:${{ needs.verify.outputs.candidate }}
        run: |
          set -euo pipefail
          project="web-retrieval-release-$GITHUB_RUN_ID"
          proxy_network="$project-proxy"
          compose=(docker compose --project-name "$project" -f docker-compose.yml -f deployment/compose.release-smoke.yaml)
          cleanup() {
            "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
            docker network rm "$proxy_network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$proxy_network"
          export TRAEFIK_NETWORK="$proxy_network"
          export TRAEFIK_ENTRYPOINT=websecure
          export TRAEFIK_CERTRESOLVER=release-smoke
          export API_HOST=release.invalid
          export API_PATH_PREFIX=/web/api
          export ALLOWED_CIDRS=127.0.0.1/32
          export ROUTER_API_KEY=release-smoke
          export FIRECRAWL_ENABLED=false
          "${compose[@]}" up -d --pull always --wait
          router_address="$("${compose[@]}" port router 8080)"
          ROUTER_URL="http://$router_address" ROUTER_API_KEY="$ROUTER_API_KEY" \
            python3 scripts/live-contract-test.py
      - name: Clear candidate images
        if: always()
        run: docker system prune -af --volumes

  promote:
    needs: [verify, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to Forgejo registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login git.firewire.cc --username "$REGISTRY_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@v3
      - name: Promote tested images
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MINOR: ${{ needs.verify.outputs.minor }}
          CANDIDATE: ${{ needs.verify.outputs.candidate }}
        run: |
          set -euo pipefail
          router=git.firewire.cc/michael/fireghost-router
          crw=git.firewire.cc/michael/fireghost-crw

          manifest_digest() {
            ref="$1"
            for attempt in 1 2 3; do
              set +e
              output="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                if ! digest="$(printf '%s' "$output" | python3 -c 'import json,sys; value=json.load(sys.stdin)["digest"]; print(value) if isinstance(value,str) and value else sys.exit(1)')"; then
                  output="malformed manifest inspection output: $output"
                else
                  printf '%s\n' "$digest"
                  return 0
                fi
              elif printf '%s' "$output" | python3 scripts/release_tags.py --is-missing-inspection; then
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 2))"
              fi
            done
            echo "registry inspection failed for $ref after 3 attempts: $output" >&2
            return 2
          }
          load_optional_digest() {
            ref="$1"
            variable="$2"
            if value="$(manifest_digest "$ref")"; then
              printf -v "$variable" '%s' "$value"
              return 0
            else
              status=$?
            fi
            if [ "$status" -eq 1 ]; then
              printf -v "$variable" '%s' ""
              return 0
            fi
            return "$status"
          }
          image_labels() {
            ref="$1"
            for attempt in 1 2 3; do
              set +e
              output="$(docker buildx imagetools inspect "$ref" --format '{{json .Image.Config.Labels}}' 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                if labels="$(printf '%s' "$output" | python3 -c 'import json,sys; value=json.load(sys.stdin); print(json.dumps(value)) if value is None or isinstance(value,dict) else sys.exit(1)')"; then
                  printf '%s\n' "$labels"
                  return 0
                fi
                output="malformed image label inspection output: $output"
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 2))"
              fi
            done
            echo "image label inspection failed for $ref after 3 attempts: $output" >&2
            return 2
          }
          existing_alias_versions() {
            alias="$1"
            existing_versions=()
            for image in "$router" "$crw"; do
              ref="$image:$alias"
              load_optional_digest "$ref" existing || return 1
              if [ -n "$existing" ]; then
                if ! version="$(image_labels "$ref" | python3 -c 'import json,sys; labels=json.load(sys.stdin) or {}; value=labels.get("io.firewire.appliance.version"); print(value) if value else sys.exit(1)')"; then
                  echo "$ref exists without a trustworthy appliance version label" >&2
                  return 1
                fi
                existing_versions+=("$version")
              fi
            done
          }
          alias_promotion_status() {
            alias="$1"
            existing_alias_versions "$alias" || return 1
            status_json="$(python3 scripts/release_tags.py --can-promote "$GITHUB_REF_NAME" "${existing_versions[@]}")" || return 1
            python3 -c 'import json,sys; print(str(json.load(sys.stdin)["promote"]).lower())' <<<"$status_json"
          }
          promote() {
            target="$1"
            source="$2"
            for attempt in 1 2 3; do
              if docker buildx imagetools create --tag "$target" "$source"; then
                return 0
              fi
              echo "promotion attempt $attempt failed for $target" >&2
              sleep "$((attempt * 2))"
            done
            return 1
          }
          ensure_immutable_version() {
            image="$1"
            candidate_digest="$2"
            load_optional_digest "$image:$VERSION" existing || return 1
            if [ -n "$existing" ]; then
              labels="$(image_labels "$image:$VERSION")"
              if ! EXPECTED_REVISION="$GITHUB_SHA" EXPECTED_VERSION="$VERSION" python3 -c 'import json,os,sys; labels=json.load(sys.stdin) or {}; valid=labels.get("org.opencontainers.image.revision")==os.environ["EXPECTED_REVISION"] and labels.get("io.firewire.appliance.version")==os.environ["EXPECTED_VERSION"]; raise SystemExit(0 if valid else 1)' <<<"$labels"; then
                echo "$image:$VERSION already exists with unexpected provenance" >&2
                return 1
              fi
              echo "$image:$VERSION already records this source revision; preserving its immutable digest"
              return 0
            fi
            promote "$image:$VERSION" "$image@$candidate_digest"
            [ "$(manifest_digest "$image:$VERSION")" = "$candidate_digest" ]
          }
          promote_alias_pair() {
            alias="$1"
            load_optional_digest "$router:$alias" router_previous || return 1
            load_optional_digest "$crw:$alias" crw_previous || return 1
            if promote "$router:$alias" "$router@$router_candidate" && \
               promote "$crw:$alias" "$crw@$crw_candidate" && \
               [ "$(manifest_digest "$router:$alias")" = "$router_candidate" ] && \
               [ "$(manifest_digest "$crw:$alias")" = "$crw_candidate" ]; then
              return 0
            fi
            echo "paired $alias promotion failed; restoring prior aliases where available" >&2
            if [ -n "$router_previous" ]; then
              promote "$router:$alias" "$router@$router_previous" || true
            fi
            if [ -n "$crw_previous" ]; then
              promote "$crw:$alias" "$crw@$crw_previous" || true
            fi
            return 1
          }

          router_candidate="$(manifest_digest "$router:$CANDIDATE")"
          crw_candidate="$(manifest_digest "$crw:$CANDIDATE")"
          ensure_immutable_version "$router" "$router_candidate"
          ensure_immutable_version "$crw" "$crw_candidate"
          # On a retry, immutable tags from the prior attempt are authoritative.
          router_candidate="$(manifest_digest "$router:$VERSION")"
          crw_candidate="$(manifest_digest "$crw:$VERSION")"

          publish_minor="$(alias_promotion_status "$MINOR")"
          publish_latest="$(alias_promotion_status latest)"

          if [ "$publish_minor" = true ]; then
            promote_alias_pair "$MINOR"
          else
            echo "not moving $MINOR backward"
          fi
          if [ "$publish_latest" = true ]; then
            promote_alias_pair latest
          else
            echo "not moving latest backward"
          fi
