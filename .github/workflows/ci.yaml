name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  router:
    name: Router checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Format, vet, unit, and race checks
        run: make check-router

  crw:
    name: CRW checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Cache Cargo inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crw/target
          key: ${{ runner.os }}-crw-${{ hashFiles('crw/Cargo.lock') }}
      - name: Workspace gate
        run: make check-crw
      - name: Process and version guards
        working-directory: crw
        run: |
          bash scripts/check-no-process-exit.sh
          bash scripts/check-internal-dep-versions.sh
          python3 -m unittest scripts/test_live_compatibility.py
          python3 -m unittest scripts/test_scrape_compatibility.py
          python3 scripts/release/audit_release_please_config.py
          python3 scripts/release/test_guards.py

  appliance:
    name: Appliance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure non-secret deployment inputs
        run: cp deploy/.env.example deploy/.env
      - name: Packaging and Compose contracts
        run: make test-appliance compose-config check-stack-lock test-hermes-regression
      - name: Build router smoke image
        run: make build-router ROUTER_IMAGE=hermes-web-retrieval-router:ci
      - name: Deterministic router smoke
        run: |
          set -euo pipefail
          docker network create hermes-web-retrieval-ci
          cleanup() {
            docker rm -f router-ci fake-cloud >/dev/null 2>&1 || true
            docker network rm hermes-web-retrieval-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --rm --name fake-cloud --network hermes-web-retrieval-ci \
            python:3.13.5-alpine3.22@sha256:37b14db89f587f9eaa890e4a442a3fe55db452b69cca1403cc730bd0fbdc8aaf \
            python -c 'from http.server import BaseHTTPRequestHandler,HTTPServer; H=type("H",(BaseHTTPRequestHandler,),{"do_POST":lambda s:(s.send_response(200),s.send_header("Content-Type","application/json"),s.end_headers(),s.wfile.write(b"{\"success\":true,\"data\":{\"web\":[{\"url\":\"https://example.invalid\"}]}}")),"log_message":lambda *a:None}); HTTPServer(("0.0.0.0",8000),H).serve_forever()'
          docker run -d --rm --name router-ci --network hermes-web-retrieval-ci \
            -p 127.0.0.1:33000:8080 \
            -e ROUTER_LOCAL_URL=http://fake-cloud:8000 \
            -e ROUTER_CLOUD_URL=http://fake-cloud:8000 \
            -e FIRECRAWL_CLOUD_API_KEY=fake-ci-key \
            -e ROUTER_DAILY_CLOUD_CREDITS=20 \
            -e ROUTER_MONTHLY_CLOUD_CREDITS=200 \
            hermes-web-retrieval-router:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:33000/health && break
            sleep 1
          done
          make smoke
